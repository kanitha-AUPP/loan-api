services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/model.joblib
      DATABASE_URL: postgresql://loan:loan@db:5432/loan_db
    volumes:
      - ./loan-api:/app
      - model-data:/app/models
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loan_db
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: loan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan -d loan_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  model-data:
